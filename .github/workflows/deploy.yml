name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_BUILD_ID: ${{ github.run_id }}
          VITE_BASE_PATH: /lian-ke/
          VITE_AUTH_REDIRECT_URL: https://fanghaoming.github.io/lian-ke/auth/callback
          VITE_SUPABASE_OAUTH_CLIENT_ID: ${{ secrets.VITE_SUPABASE_OAUTH_CLIENT_ID }}
          VITE_SUPABASE_OAUTH_TOKEN_URL: ${{ secrets.VITE_SUPABASE_OAUTH_TOKEN_URL }}
      - name: Verify OAuth build configuration
        env:
          VITE_SUPABASE_OAUTH_CLIENT_ID: ${{ secrets.VITE_SUPABASE_OAUTH_CLIENT_ID }}
          VITE_SUPABASE_OAUTH_TOKEN_URL: ${{ secrets.VITE_SUPABASE_OAUTH_TOKEN_URL }}
        run: |
          test -n "$VITE_SUPABASE_OAUTH_CLIENT_ID" || {
            echo "Missing repository secret VITE_SUPABASE_OAUTH_CLIENT_ID"
            exit 1
          }
          test -n "$VITE_SUPABASE_OAUTH_TOKEN_URL" || {
            echo "Missing repository secret VITE_SUPABASE_OAUTH_TOKEN_URL"
            exit 1
          }
          rg -l --fixed-strings "$VITE_SUPABASE_OAUTH_CLIENT_ID" dist >/dev/null || {
            echo "VITE_SUPABASE_OAUTH_CLIENT_ID was not embedded in dist"
            exit 1
          }
          rg -l --fixed-strings "$VITE_SUPABASE_OAUTH_TOKEN_URL" dist >/dev/null || {
            echo "VITE_SUPABASE_OAUTH_TOKEN_URL was not embedded in dist"
            exit 1
          }
      - name: Build native app assets for remote updates
        run: |
          mv dist dist-web
          VITE_BUILD_ID=${GITHUB_RUN_ID} CAPACITOR_BUILD=1 pnpm build
          mv dist dist-web/app-assets
          mv dist-web dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
