name: Release version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web release
        run: pnpm build
        env:
          VITE_BASE_PATH: /lian-ke/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Package web release
        run: tar -czf "lianke-web-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Sync Android project
        run: pnpm native:sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build installable Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename Android artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "lianke-android-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "lianke-web-${GITHUB_REF_NAME}.tar.gz" \
            "lianke-android-${GITHUB_REF_NAME}.apk" \
            --verify-tag \
            --title "练刻 ${GITHUB_REF_NAME}" \
            --generate-notes
