name: Release version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native resource updates before packaging
        run: pnpm test:native-assets

      - name: Build web release
        run: pnpm build
        env:
          VITE_BASE_PATH: /lian-ke/
          VITE_AUTH_REDIRECT_URL: https://fanghaoming.github.io/lian-ke/auth/callback
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_OAUTH_CLIENT_ID: ${{ secrets.VITE_SUPABASE_OAUTH_CLIENT_ID }}
          VITE_SUPABASE_OAUTH_TOKEN_URL: https://jagugsfdnwyaclrxpsum.supabase.co/functions/v1/supabase-oauth-token
          VITE_SUPABASE_OAUTH_REDIRECT_URL: https://fanghaoming.github.io/lian-ke/supabase/callback

      - name: Package web release
        run: tar -czf "lianke-web-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Sync Android project
        run: pnpm native:sync
        env:
          VITE_AUTH_REDIRECT_URL: https://fanghaoming.github.io/lian-ke/auth/callback
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_OAUTH_CLIENT_ID: ${{ secrets.VITE_SUPABASE_OAUTH_CLIENT_ID }}
          VITE_SUPABASE_OAUTH_TOKEN_URL: https://jagugsfdnwyaclrxpsum.supabase.co/functions/v1/supabase-oauth-token
          VITE_SUPABASE_OAUTH_REDIRECT_URL: https://fanghaoming.github.io/lian-ke/supabase/callback?app=1

      - name: Prepare stable Android debug signing
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
          ANDROID_DEBUG_SIGN: false
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || {
            echo "Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret"
            exit 1
          }
          test -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD" || {
            echo "Missing ANDROID_DEBUG_KEYSTORE_PASSWORD repository secret"
            exit 1
          }
          test -n "$ANDROID_DEBUG_KEY_ALIAS" || {
            echo "Missing ANDROID_DEBUG_KEY_ALIAS repository secret"
            exit 1
          }
          test -n "$ANDROID_DEBUG_KEY_PASSWORD" || {
            echo "Missing ANDROID_DEBUG_KEY_PASSWORD repository secret"
            exit 1
          }
          export ANDROID_DEBUG_KEYSTORE_BASE64
          python3 - <<'PY'
          import base64
          import os

          value = os.environ['ANDROID_DEBUG_KEYSTORE_BASE64'].strip()
          if value.startswith('data:') and ',' in value:
              value = value.split(',', 1)[1]
          value = ''.join(value.split())
          value += '=' * (-len(value) % 4)
          with open('android/lianke-debug.keystore', 'wb') as keystore:
              keystore.write(base64.b64decode(value, validate=False))
          PY
          keytool -list -v \
            -keystore android/lianke-debug.keystore \
            -storetype PKCS12 \
            -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_DEBUG_KEY_ALIAS" >/dev/null

      - name: Build installable Android APK
        working-directory: android
        run: ./gradlew assembleUnsigned --no-daemon
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/android/lianke-debug.keystore
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}

      - name: Rename Android artifact
        run: |
          apk_path="$(find android/app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          test -n "$apk_path" || {
            echo "No APK found under android/app/build/outputs/apk"
            find android/app/build/outputs -maxdepth 4 -type f -print
            exit 1
          }
          cp "$apk_path" "lianke-android-${GITHUB_REF_NAME}.apk"

      - name: Apply compatibility APK signatures
        env:
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          jarsigner \
            -keystore android/lianke-debug.keystore \
            -storetype PKCS12 \
            -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_DEBUG_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "lianke-android-${GITHUB_REF_NAME}.apk" \
            "$ANDROID_DEBUG_KEY_ALIAS"

      - name: Verify APK signature
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path" || {
            echo "Unable to locate apksigner under $ANDROID_HOME/build-tools"
            exit 1
          }
          "$apksigner_path" verify --verbose "lianke-android-${GITHUB_REF_NAME}.apk"
          "$apksigner_path" verify --verbose "lianke-android-${GITHUB_REF_NAME}.apk" | tee /tmp/apksigner-output.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/apksigner-output.txt
          unzip -l "lianke-android-${GITHUB_REF_NAME}.apk" | grep -E 'META-INF/.*\.(RSA|DSA|EC)$'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_options=()
          case "$GITHUB_REF_NAME" in
            *-rc*) release_options+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "${release_options[@]}" \
            "lianke-web-${GITHUB_REF_NAME}.tar.gz" \
            "lianke-android-${GITHUB_REF_NAME}.apk" \
            --verify-tag \
            --title "练刻 ${GITHUB_REF_NAME}" \
            --generate-notes
