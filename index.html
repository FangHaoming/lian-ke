border-radius:100px;background:#263842;color:#bceaf6;padding:5px 11px;font-size:12px}.exercise{padding:15px;background:#101921;border:1px solid #2c3b45;border-radius:14px;margin:12px 0}.exercise-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.exercise-title{font-weight:800}.exercise-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:9px;margin-top:12px}.timer{text-align:center;padding:30px 10px}.clock{font-size:clamp(62px,12vw,116px);font-variant-numeric:tabular-nums;font-weight:900;letter-spacing:-4px;line-height:1.25}.accent{color:#b7f36a}.orange{color:#ffcb83}.progress{height:8px;background:#293a42;border-radius:20px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#b7f36a;transition:width .2s}.metric{background:#101921;border:1px solid #293943;padding:17px;border-radius:14px}.metric strong{display:block;font-size:27px;margin-top:8px}.setline{padding:12px 0;border-bottom:1px solid #293741;display:flex;justify-content:space-between;align-items:center;gap:8px}.setline:last-child{border:0}.chart{width:100%;height:210px;display:block}.notice{background:#263323;color:#d4f5b4;padding:12px;border-radius:11px;font-size:13px}.warning{background:#382d1d;color:#ffdda5;padding:12px;border-radius:11px;font-size:13px}.hidden{display:none!important}.empty{text-align:center;color:#93a6b0;padding:32px 10px}.review-row{display:grid;grid-template-columns:1.4fr repeat(3,minmax(65px,.7fr));gap:8px;align-items:end;margin:12px 0;padding-bottom:12px;border-bottom:1px solid #293943}.review-row .field input{padding:9px 6px}.badge{font-size:11px;color:#94b2c1}.spacer{height:8px}@media(max-width:520px){.app{padding:16px 12px 85px}.panel{padding:15px}.review-row{grid-template-columns:1fr 1fr 1fr}.review-row>div:first-child{grid-column:1/-1}.top .small{display:none}.btn{padding:11px 13px}}
.exercise[draggable="true"]{cursor:grab}.exercise.dragging{opacity:.35}.exercise.drag-over{outline:2px dashed #b7f36a}.drag-handle{color:#b7f36a;font-size:19px;cursor:grab}.time-dialog{border:1px solid #40505a;border-radius:18px;background:#151e26;color:#eaf2f4;padding:24px;max-width:340px;width:calc(100% - 30px)}.time-dialog::backdrop{background:#000b}.time-pickers{display:flex;gap:14px;margin:20px 0}.time-pickers .field{flex:1}.time-input{cursor:pointer!important}.wheel-wrap{position:relative;flex:1;min-width:0}.wheel-title{color:#a7b9c4;margin-bottom:12px;text-align:center;width:100%}.wheel{height:192px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:none;touch-action:pan-y;border-radius:14px;background:#0c141a;padding:64px 0;box-sizing:border-box}.wheel::-webkit-scrollbar{display:none}.wheel-option{height:64px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:26px;color:#81949e;cursor:pointer;user-select:none;transition:color .12s,font-size .12s}.wheel-option.active{color:#eff8f8;font-size:34px;font-weight:700}.wheel-wrap:after{content:'';pointer-events:none;position:absolute;left:0;right:0;top:calc(100% - 96px);height:64px;transform:translateY(-50%);border-top:1px solid #455a66;border-bottom:1px solid #455a66;background:#ffffff09;border-radius:8px} .time-pickers{gap:12px}.time-pickers .wheel-option{font-size:23px}.time-pickers .wheel-option.active{font-size:31px}.wheel{touch-action:none;cursor:grab;scroll-snap-type:y mandatory}.wheel.is-dragging,.wheel.is-gliding{scroll-snap-type:none;scroll-behavior:auto}.wheel.is-dragging{cursor:grabbing;user-select:none}.wheel-option{line-height:1;text-align:center;flex-shrink:0}.wheel-wrap:after{z-index:1}.wheel-wrap{isolation:isolate} @media(max-width:480px){.time-dialog{padding:20px}.wheel-option{font-size:25px}.wheel-option.active{font-size:33px}} 
/* Touch-friendly custom exercise suggestions */
.exercise-name-picker{position:relative;width:100%;min-width:0}
.exercise-name-picker>input{width:100%}
.exercise-name-options{position:absolute;top:calc(100% + 5px);left:0;right:0;min-width:190px;max-height:260px;overflow-y:auto;overscroll-behavior:contain;background:#192630;border:1px solid #49606c;border-radius:12px;box-shadow:0 12px 28px #000a;z-index:50;padding:5px}
.exercise-name-options[hidden]{display:none}
.exercise-name-option{display:block;width:100%;text-align:left;padding:12px 13px;color:#eaf2f4;background:transparent;border:0;border-radius:8px;min-height:44px;touch-action:manipulation}
.exercise-name-option:hover,.exercise-name-option:focus-visible{background:#334752;outline:none}
.exercise-name-empty{padding:12px;color:#a7b8c2;font-size:12px}
.exercise:has(.exercise-name-options:not([hidden])){position:relative;z-index:5}
 /* Editor quick navigation, only for plans with more than five exercises */
.editor-quick-nav{position:fixed;right:max(14px,calc((100vw - 1110px)/2));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:10px}
.editor-quick-nav[hidden]{display:none!important}.editor-quick-nav button{width:48px;height:48px;border:1px solid #405561;border-radius:50%;background:#22313b;color:#eaf2f4;font-size:23px;box-shadow:0 5px 20px #0008;display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .15s}
.editor-quick-nav button:hover{background:#344957;transform:translateY(-2px)}
.editor-quick-nav button:focus-visible{outline:2px solid #b7f36a;outline-offset:3px}
@media(max-width:600px){.editor-quick-nav{right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}.editor-quick-nav button{width:44px;height:44px}}

.unified-select{position:relative;width:100%;min-width:0}
.unified-native{position:absolute!important;opacity:0!important;pointer-events:none!important;width:1px!important;height:1px!important;padding:0!important}
.unified-trigger{width:100%;min-height:48px;text-align:left;padding:11px 42px 11px 13px;background:#0e171e;border:1px solid #354956;border-radius:12px;color:#eaf2f4;position:relative}
.unified-trigger:after{content:"";position:absolute;right:17px;top:43%;width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}
.unified-select.open .unified-trigger{border-color:#b7f36a}
.unified-menu{position:absolute;z-index:80;top:calc(100% + 6px);left:0;right:0;min-width:190px;max-height:270px;overflow:auto;overscroll-behavior:contain;background:#192630;border:1px solid #49606c;border-radius:12px;box-shadow:0 12px 28px #000a;padding:5px}
.unified-menu[hidden]{display:none}
.unified-option{display:block;width:100%;min-height:44px;text-align:left;padding:11px 13px;background:transparent;border:0;border-radius:8px;color:#eaf2f4;touch-action:manipulation}
.unified-option.selected{color:#b7f36a;background:#304337}
.unified-option:hover,.unified-option:focus-visible{background:#334752;outline:none}
.exercise:has(.unified-select.open),.panel:has(.unified-select.open){position:relative;z-index:12}

/* Training type: single-line, vertically centered and consistent with adjacent fields */
.training-mode-select .unified-trigger{display:flex;align-items:center;min-height:48px;height:48px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(12px,1.05vw,16px);padding:10px 34px 10px 12px;font-weight:500}
.training-mode-select .unified-trigger:after{top:50%;right:14px;transform:translateY(-70%) rotate(45deg);flex-shrink:0}
.training-mode-select .unified-menu{min-width:max(100%,200px)}
.training-mode-select .unified-option{white-space:nowrap;font-size:14px}
@media(max-width:650px){.training-mode-select .unified-trigger{font-size:13px;padding-right:29px}.training-mode-select .unified-trigger:after{right:12px}}
/* Align the training-mode control to the exact same box height as its neighboring inputs. */
.exercise .field > input:not([type="hidden"]),
.exercise .field > .exercise-name-picker > input,
.exercise .field > .unified-select > .unified-trigger {
  height: 48px;
  min-height: 48px;
  box-sizing: border-box;
}
.exercise .field > .unified-select > .unified-trigger {
  display: flex;
  align-items: center;
  line-height: 1;
  padding-top: 0;
  padding-bottom: 0;
}
 .quick-card{padding:16px;border:1px solid #354956;border-radius:14px;margin-top:12px;background:#101b23}.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-top:12px}.quick-grid .field{min-width:0}.quick-grid input{width:100%} .quick-name-wrap{position:relative;flex:1;min-width:180px}.quick-name-wrap>input{width:100%}.quick-name-wrap .exercise-name-options{z-index:100}

/* Quick workout action combobox — visually matches the app's other selectors. */
.quick-name-wrap{position:relative;flex:1 1 280px;min-width:0;max-width:520px}
.quick-name-wrap>input#quickName{display:block;width:100%;height:48px;min-height:48px;box-sizing:border-box;border:1px solid #354956;border-radius:12px;background:#0e171e;color:#eaf2f4;padding:0 46px 0 16px;font:inherit;line-height:48px;outline:none;transition:border-color .15s,box-shadow .15s}
.quick-name-wrap>input#quickName::placeholder{color:#91a4af;opacity:1}
.quick-name-wrap>input#quickName:focus{border-color:#b7f36a;box-shadow:0 0 0 2px rgba(183,243,106,.12)}
.quick-name-wrap::after{content:"";pointer-events:none;position:absolute;right:19px;top:18px;width:9px;height:9px;border-right:2px solid #c5d6dc;border-bottom:2px solid #c5d6dc;transform:rotate(45deg)}
.quick-name-wrap:focus-within::after{border-color:#b7f36a}
.quick-name-wrap .exercise-name-options{top:calc(100% + 6px);left:0;right:0;max-height:260px;z-index:110}
@media(max-width:600px){.quick-name-wrap{flex-basis:100%;max-width:none}}

/* Shared control height for quick workout fields and plan selector */
.quick-grid .field>input,
.quick-grid .field>.unified-select>.unified-trigger,
.plan-start-picker>.unified-select>.unified-trigger,
.plan-start-picker>select:not(.unified-native){height:48px!important;min-height:48px!important;box-sizing:border-box;display:flex;align-items:center;padding-top:0;padding-bottom:0;line-height:1.2}
.quick-grid .field>.unified-select>.unified-trigger{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:34px}
.quick-grid .field>.unified-select>.unified-trigger:after{top:50%;transform:translateY(-70%) rotate(45deg)}
.plan-start-row{display:flex;align-items:flex-end;gap:16px;max-width:760px}
.plan-start-picker{flex:1 1 auto;min-width:0;max-width:560px}
.plan-start-button{height:48px;min-height:48px;flex:0 0 auto;white-space:nowrap}
.plan-start-summary{margin-top:12px}
@media(max-width:520px){.plan-start-row{gap:10px}.plan-start-button{padding-inline:12px}.plan-start-picker{flex:1;min-width:0}}
.quick-sound-panel{margin-top:18px;padding:14px;border:1px solid #354956;border-radius:12px}.quick-sound-tests{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.quick-sound-tests .btn{min-height:42px;font-size:13px}</style></head><body><script src="https://cdn.jsdelivr.net/npm//supabase-js@2"></script><div class="app"><header class="top"><div><div class="logo">练<span>刻</span> <span style="font-size:12px;color:#7c909b;font-weight:400">FIT LOG</span></div><div class="muted small">你的训练节奏、计划与进步</div></div><span class="pill" id="today"></span></header><nav class="tabs" id="tabs"><button class="tab active" data-tab="train">◉ 训练</button><button class="tab" data-tab="plans">▦ 训练计划</button><button class="tab" data-tab="stats">▥ 数据分析</button><button class="tab" data-tab="settings">⚙ 设置/备份</button></nav><main id="view"></main></div><aside id="editorQuickNav" class="editor-quick-nav" aria-label="动作列表快捷导航" hidden><button type="button" id="editorGoTop" title="滚动到顶部" aria-label="滚动到顶部">↑</button><button type="button" id="editorGoBottom" title="滚动到底部" aria-label="滚动到底部">↓</button></aside><dialog id="timeDialog" class="time-dialog"><h3>选择时间</h3><div class="time-pickers"><div class="wheel-wrap"><div class="wheel-title">分钟</div><div class="wheel" id="pickMin" tabindex="0" role="listbox" aria-label="分钟"></div></div><div class="wheel-wrap"><div class="wheel-title">秒钟</div><div class="wheel" id="pickSec" tabindex="0" role="listbox" aria-label="秒钟"></div></div></div><div class="row between"><button class="btn ghost" id="timeCancel">取消</button><button class="btn primary" id="timeConfirm">确定</button></div></dialog><dialog id="abortDialog" class="time-dialog" aria-labelledby="abortTitle"><h3 id="abortTitle">放弃本次训练？</h3><p class="muted">当前训练进度尚未保存，放弃后无法恢复。</p><div class="row between"><button type="button" class="btn ghost" id="abortCancel">继续训练</button><button type="button" class="btn red" id="abortConfirm">确认放弃</button></div></dialog><input type="file" id="importFile" accept="application/json,.json" class="hidden"><script>
(()=>{'use strict';
const KEY='lianke_v3';const names=['引体向上','俯卧撑','深蹲','保加利亚蹲','上推哑铃','健腹轮'];const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=(v,min=0,max=9999)=>Math.max(min,Math.min(max,Number(v)||0));const fmt=s=>{s=Math.max(0,Math.floor(s));const mm=String(Math.floor(s/60)%60).padStart(2,'0'),ss=String(s%60).padStart(2,'0');return s>=3600?`${String(Math.floor(s/3600)).padStart(2,'0')}:${mm}:${ss}`:`${String(Math.floor(s/60)).padStart(2,'0')}:${ss}`};const date=d=>{const t=new Date(d);return Number.isNaN(t.getTime())?'时间未知':`${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`};
const mk=(name,sets=3,reps=10,weight=0,mode='reps',duration=40,rest=60)=>({id:uid(),name,sets,reps,weight,mode,duration,rest});
const defaults=()=>({plans:[{id:uid(),name:'上肢与核心日',items:[mk('引体向上',3,8),mk('俯卧撑',3,15),mk('上推哑铃',3,12,5),mk('健腹轮',3,10)]},{id:uid(),name:'练腿日',items:[mk('深蹲',4,15),mk('保加利亚蹲',3,12,0)]}],records:[],selected:null,sounds:{set:'triple',rest:'double',finish:'victory'}});
const CLOUD_KEY='lianke_supabase_config';
function supabaseClient(){const c=cloudConfig();return c.url&&c.anonKey&&window.supabase?window.supabase.createClient(c.url,c.anonKey):null}
function cloudSession(){try{return JSON.parse(localStorage.getItem('lianke_supabase_session'))||null}catch{return null}}
async function currentUser(){const session=cloudSession();return session?.user||null}
async function cloudAuth(action){const c=cloudConfig();if(!c.url||!c.anonKey)return alert('请先在设置页配置 Supabase');const email=$('authEmail')?.value.trim(),password=$('authPassword')?.value;if(!email||!password)return alert('请输入邮箱和密码');const endpoint=action==='signup'?'/auth/v1/signup?redirect_to='+encodeURIComponent(location.origin+location.pathname):'/auth/v1/token?grant_type=password';const r=await fetch(c.url+endpoint,{method:'POST',headers:{'Content-Type':'application/json',apikey:c.anonKey},body:JSON.stringify({email,password})});let data={};try{data=await r.json()}catch{}if(!r.ok){const msg=data.msg||data.message||data.error_description||('请求失败：HTTP '+r.status);if(msg==='Email not confirmed')return alert('邮箱尚未确认，请先打开注册确认邮件中的链接，再返回登录。');return alert(msg);}if(data.access_token)localStorage.setItem('lianke_supabase_session',JSON.stringify(data));alert(action==='signup'?'注册成功，请检查邮箱确认后再登录':'登录成功');render()}
async function cloudSignOut(){const s=supabaseClient();if(s)await s.auth.signOut();render()}
async function syncExerciseNames(){const c=cloudConfig(),session=cloudSession(),status=$('cloudConfigStatus');if(!c.url||!c.anonKey)return alert('请先在设置页配置 Supabase');if(!session?.access_token)return alert('请先登录 Supabase');if(status)status.textContent='正在同步动作……';const headers={apikey:c.anonKey,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'};try{const local=availableNames();if(local.length){const r=await fetch(c.url+'/rest/v1/exercise_names',{method:'POST',headers:{...headers,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(local.map(name=>({user_id:session.user.id,name})))});if(!r.ok)throw Error('上传失败 HTTP '+r.status)}const r=await fetch(c.url+'/rest/v1/exercise_names?select=name&user_id=eq.'+encodeURIComponent(session.user.id)+'&order=name',{headers});if(!r.ok)throw Error('读取失败 HTTP '+r.status);const data=await r.json();db.exerciseNames=[...new Set(data.map(x=>x.name))];save();if(status)status.textContent='动作同步成功，共 '+db.exerciseNames.length+' 个';alert('动作同步成功');render()}catch(e){if(status)status.textContent='同步失败：'+e.message;alert('同步失败：'+e.message)}}
function authPanelHTML(){return `<div class="panel"><h3>云端账号</h3><p class="muted small">配置 Supabase 后，可使用邮箱注册或登录，动作列表将同步到云端。</p><div class="row"><input id="authEmail" type="email" placeholder="邮箱"><input id="authPassword" type="password" placeholder="密码"></div><div class="row"><button class="btn" id="authSignup">注册</button><button class="btn primary" id="authSignin">登录</button><button class="btn" id="authSignout">退出</button><button class="btn" id="syncExercises">同步动作</button></div></div>`}

function savedNames(){
 if(db.exerciseNamesVersion!==2){
  const previous=Array.isArray(db.exerciseNames)?db.exerciseNames:[];
  const planNames=db.plans.flatMap(p=>p.items.map(it=>it.name));
  db.exerciseNames=[...new Set([...names,...previous,...planNames].filter(n=>typeof n==='string'&&n.trim()).map(n=>n.trim()))];
  db.exerciseNamesVersion=2;save();
 }
 return db.exerciseNames.filter(n=>typeof n==='string'&&n.trim());
}

// Reorder exercise cards with native HTML drag-and-drop.
let draggedExerciseIndex=null;
$('editorGoTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
$('editorGoBottom').addEventListener('click',()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'}));
const editorView=$('view');
editorView.addEventListener('dragstart',e=>{
  const card=e.target.closest('.exercise[data-ex]');
  if(!editing||!card)return;
  // Inputs and selectors must remain usable without initiating a drag.
  if(e.target.closest('input,select,textarea,button')){e.preventDefault();return}
  draggedExerciseIndex=Number(card.dataset.ex);
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',String(draggedExerciseIndex));
  requestAnimationFrame(()=>card.classList.add('dragging'));
});
editorView.addEventListener('dragover',e=>{
  const card=e.target.closest('.exercise[data-ex]');
  if(!editing||draggedExerciseIndex===null||!card)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  editorView.querySelectorAll('.exercise.drag-over').forEach(x=>x.classList.remove('drag-over'));
  if(Number(card.dataset.ex)!==draggedExerciseIndex)card.classList.add('drag-over');
});
editorView.addEventListener('drop',e=>{
  const card=e.target.closest('.exercise[data-ex]');
  if(!editing||draggedExerciseIndex===null||!card)return;
  e.preventDefault();
  const from=draggedExerciseIndex,to=Number(card.dataset.ex);
  draggedExerciseIndex=null;
  editorView.querySelectorAll('.exercise.dragging,.exercise.drag-over').forEach(x=>x.classList.remove('dragging','drag-over'));
  if(from===to||from<0||to<0||from>=editing.items.length||to>=editing.items.length)return;
  const [item]=editing.items.splice(from,1);
  editing.items.splice(to,0,item);
  render(); // Save Plan persists the updated order.
});
editorView.addEventListener('dragend',()=>{
  draggedExerciseIndex=null;
  editorView.querySelectorAll('.exercise.dragging,.exercise.drag-over').forEach(x=>x.classList.remove('dragging','drag-over'));
});
let timeTarget=null;
const WHEEL_ROW=64;
function wheelValue(id){return Math.max(0,Math.min(59,Math.round($(id).scrollTop/WHEEL_ROW)))}
function setWheel(id,value){const el=$(id);el.dispatchEvent(new Event('wheel-picker-reset'));el.scrollTop=value*WHEEL_ROW;updateWheel(id)}
function updateWheel(id){const el=$(id),v=wheelValue(id);el.querySelectorAll('.wheel-option').forEach((node,i)=>{node.classList.toggle('active',i===v);node.setAttribute('aria-selected',String(i===v))})}
for(const id of ['pickMin','pickSec']){const el=$(id);el.innerHTML=Array.from({length:60},(_,i)=>`<div class="wheel-option" role="option" data-value="${i}">${String(i).padStart(2,'0')}</div>`).join('');el.addEventListener('scroll',()=>updateWheel(id),{passive:true});el.addEventListener('click',e=>{const opt=e.target.closest('.wheel-option');if(opt)el.scrollTo({top:Number(opt.dataset.value)*WHEEL_ROW,behavior:'smooth'})});el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();setWheel(id,Math.max(0,Math.min(59,wheelValue(id)+(e.key==='ArrowDown'?1:-1))))}})}
// Drag with momentum: velocity is measured from recent pointer samples and decays smoothly.
for(const id of ['pickMin','pickSec']){
 const el=$(id);let drag=null,frame=0,suppressClick=false,snapTimer=0;
 const stop=()=>{if(frame)cancelAnimationFrame(frame);frame=0;clearTimeout(snapTimer);el.classList.remove('is-gliding')};
 const snap=()=>{el.classList.remove('is-gliding','is-dragging');const target=wheelValue(id)*WHEEL_ROW;el.scrollTo({top:target,behavior:'smooth'})};
 el.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  stop();el.classList.add('is-dragging');
  drag={id:e.pointerId,startY:e.clientY,lastY:e.clientY,lastT:performance.now(),samples:[],moved:false};
  el.setPointerCapture(e.pointerId);
 });
 el.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId)return;
  const now=performance.now(),dy=e.clientY-drag.lastY,dt=Math.max(1,now-drag.lastT);
  if(Math.abs(e.clientY-drag.startY)>4)drag.moved=true;
  if(drag.moved){
   el.scrollTop-=dy;
   drag.samples.push({v:-dy/dt,t:now});
   drag.samples=drag.samples.filter(x=>now-x.t<100).slice(-7);
   e.preventDefault();
  }
  drag.lastY=e.clientY;drag.lastT=now;
 });
 const finish=e=>{
  if(!drag||drag.id!==e.pointerId)return;
  const {moved,samples}=drag;drag=null;
  if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId);
  el.classList.remove('is-dragging');
  if(!moved)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,250);
  const recent=samples.filter(x=>performance.now()-x.t<110);
  let velocity=recent.length?recent.reduce((sum,x)=>sum+x.v,0)/recent.length:0;
  velocity=Math.max(-2.4,Math.min(2.4,velocity));
  if(Math.abs(velocity)<.12){snap();return}
  el.classList.add('is-gliding');let last=performance.now();
  const glide=now=>{
   const dt=Math.min(now-last,40);last=now;
   const before=el.scrollTop;
   el.scrollTop+=velocity*dt;
   velocity*=Math.pow(.94,dt/16);
   if(Math.abs(velocity)<.055||Math.abs(el.scrollTop-before)<.1){frame=0;snap();return}
   frame=requestAnimationFrame(glide);
  };
  frame=requestAnimationFrame(glide);
 };
 el.addEventListener('pointerup',finish);
 el.addEventListener('pointercancel',finish);
 el.addEventListener('click',e=>{if(suppressClick){e.stopImmediatePropagation();e.preventDefault()}},true);
 el.addEventListener('wheel',()=>{stop();clearTimeout(snapTimer);snapTimer=setTimeout(snap,140)},{passive:true});
 el.addEventListener('keydown',stop);
 el.addEventListener('wheel-picker-reset',()=>{stop();el.classList.remove('is-dragging')});
}
