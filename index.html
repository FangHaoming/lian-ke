.quick-sound-panel{margin-top:18px;padding:14px;border:1px solid #354956;border-radius:12px}.quick-sound-tests{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.quick-sound-tests .btn{min-height:42px;font-size:13px}</style></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><div class="app"><header class="top"><div><div class="logo">练<span>刻</span> <span style="font-size:12px;color:#7c909b;font-weight:400">FIT LOG</span></div><div class="muted small">你的训练节奏、计划与进步</div></div><span class="pill" id="today"></span></header><nav class="tabs" id="tabs"><button class="tab active" data-tab="train">◉ 训练</button><button class="tab" data-tab="plans">▦ 训练计划</button><button class="tab" data-tab="stats">▥ 数据分析</button><button class="tab" data-tab="settings">⚙ 设置/备份</button></nav><main id="view"></main></div><aside id="editorQuickNav" class="editor-quick-nav" aria-label="动作列表快捷导航" hidden><button type="button" id="editorGoTop" title="滚动到顶部" aria-label="滚动到顶部">↑</button><button type="button" id="editorGoBottom" title="滚动到底部" aria-label="滚动到底部">↓</button></aside><dialog id="timeDialog" class="time-dialog"><h3>选择时间</h3><div class="time-pickers"><div class="wheel-wrap"><div class="wheel-title">分钟</div><div class="wheel" id="pickMin" tabindex="0" role="listbox" aria-label="分钟"></div></div><div class="wheel-wrap"><div class="wheel-title">秒钟</div><div class="wheel" id="pickSec" tabindex="0" role="listbox" aria-label="秒钟"></div></div></div><div class="row between"><button class="btn ghost" id="timeCancel">取消</button><button class="btn primary" id="timeConfirm">确定</button></div></dialog><dialog id="abortDialog" class="time-dialog" aria-labelledby="abortTitle"><h3 id="abortTitle">放弃本次训练？</h3><p class="muted">当前训练进度尚未保存，放弃后无法恢复。</p><div class="row between"><button type="button" class="btn ghost" id="abortCancel">继续训练</button><button type="button" class="btn red" id="abortConfirm">确认放弃</button></div></dialog><input type="file" id="importFile" accept="application/json,.json" class="hidden"><script>
(()=>{'use strict';
const KEY='lianke_v3';const names=['引体向上','俯卧撑','深蹲','保加利亚蹲','上推哑铃','健腹轮'];const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=(v,min=0,max=9999)=>Math.max(min,Math.min(max,Number(v)||0));const fmt=s=>{s=Math.max(0,Math.floor(s));const mm=String(Math.floor(s/60)%60).padStart(2,'0'),ss=String(s%60).padStart(2,'0');return s>=3600?`${String(Math.floor(s/3600)).padStart(2,'0')}:${mm}:${ss}`:`${String(Math.floor(s/60)).padStart(2,'0')}:${ss}`};const date=d=>{const t=new Date(d);return Number.isNaN(t.getTime())?'时间未知':`${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`};
const mk=(name,sets=3,reps=10,weight=0,mode='reps',duration=40,rest=60)=>({id:uid(),name,sets,reps,weight,mode,duration,rest});
const defaults=()=>({plans:[{id:uid(),name:'上肢与核心日',items:[mk('引体向上',3,8),mk('俯卧撑',3,15),mk('上推哑铃',3,12,5),mk('健腹轮',3,10)]},{id:uid(),name:'练腿日',items:[mk('深蹲',4,15),mk('保加利亚蹲',3,12,0)]}],records:[],selected:null,sounds:{set:'triple',rest:'double',finish:'victory'}});
const CLOUD_KEY='lianke_supabase_config';
function cloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_KEY))||{}}catch{return {}}}
function supabaseClient(){const c=cloudConfig();return c.url&&c.anonKey&&window.supabase?window.supabase.createClient(c.url,c.anonKey):null}
function cloudSession(){try{return JSON.parse(localStorage.getItem('lianke_supabase_session'))||null}catch{return null}}
async function currentUser(){const s=supabaseClient();if(!s)return null;const r=await s.auth.getUser();return r.data?.user||null}
async function cloudAuth(action){const c=cloudConfig();if(!c.url||!c.anonKey)return alert('请先在设置页配置 Supabase');const email=$('authEmail')?.value.trim(),password=$('authPassword')?.value;if(!email||!password)return alert('请输入邮箱和密码');const endpoint=action==='signup'?'/auth/v1/signup?redirect_to='+encodeURIComponent(location.origin+location.pathname):'/auth/v1/token?grant_type=password';const r=await fetch(c.url+endpoint,{method:'POST',headers:{'Content-Type':'application/json',apikey:c.anonKey},body:JSON.stringify({email,password})});let data={};try{data=await r.json()}catch{}if(!r.ok){const msg=data.msg||data.message||data.error_description||('请求失败：HTTP '+r.status);if(msg==='Email not confirmed')return alert('邮箱尚未确认，请先打开注册确认邮件中的链接，再返回登录。');return alert(msg);}if(data.access_token)localStorage.setItem('lianke_supabase_session',JSON.stringify(data));alert(action==='signup'?'注册成功，请检查邮箱确认后再登录':'登录成功');render()}
async function cloudSignOut(){localStorage.removeItem('lianke_supabase_session');render()}
async function syncExerciseNames(){const c=cloudConfig(),session=cloudSession(),status=$('cloudConfigStatus');if(!c.url||!c.anonKey)return alert('请先在设置页配置 Supabase');if(!session?.access_token)return alert('请先登录 Supabase');if(status)status.textContent='正在同步动作……';const headers={apikey:c.anonKey,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'};try{const local=availableNames();if(local.length){const r=await fetch(c.url+'/rest/v1/exercise_names',{method:'POST',headers:{...headers,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(local.map(name=>({user_id:session.user.id,name})))});if(!r.ok)throw Error('上传失败 HTTP '+r.status)}const r=await fetch(c.url+'/rest/v1/exercise_names?select=name&user_id=eq.'+encodeURIComponent(session.user.id)+'&order=name',{headers});if(!r.ok)throw Error('读取失败 HTTP '+r.status);const data=await r.json();db.exerciseNames=[...new Set(data.map(x=>x.name))];save();if(status)status.textContent='动作同步成功，共 '+db.exerciseNames.length+' 个';alert('动作同步成功');render()}catch(e){if(status)status.textContent='同步失败：'+e.message;alert('同步失败：'+e.message)}}

function saveCloudConfig(){const url=$('supabaseUrl')?.value.trim().replace(/\/$/,'');const anonKey=$('supabaseAnonKey')?.value.trim();if(!/^https:\/\/[^\s]+\.supabase\.co$/.test(url)||!anonKey)return alert('请填写正确的 Supabase Project URL 和 anon public key');localStorage.setItem(CLOUD_KEY,JSON.stringify({url,anonKey}));const status=$('cloudConfigStatus');if(status)status.textContent='配置已保存到本地浏览器';}
async function testCloudConfig(){const cfg={url:$('supabaseUrl')?.value.trim().replace(/\/$/,''),anonKey:$('supabaseAnonKey')?.value.trim()};const status=$('cloudConfigStatus');if(!cfg.url||!cfg.anonKey)return alert('请先填写 Project URL 和 anon public key');if(status)status.textContent='正在测试连接……';try{const r=await fetch(cfg.url+'/rest/v1/exercise_names?select=id&limit=1',{method:'GET',mode:'cors',headers:{apikey:cfg.anonKey}});if(!r.ok&&r.status!==404){if(r.status===401)throw Error('HTTP 401：Key 无效，请从 Project Settings → API 重新复制 publishable key');throw Error('HTTP '+r.status);}if(status)status.textContent='连接成功，可以开始登录和同步';}catch(e){const local=location.protocol==='file:'?'；当前是直接打开 HTML，建议通过本地服务器打开':'；请检查网络、Project URL 和 publishable key';if(status)status.textContent='连接失败：'+(e.message||e)+local;}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.plans)||!Array.isArray(db.records))db=defaults();if(!db.sounds)db.sounds=defaults().sounds;if('volume' in db){delete db.volume;try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}if(!db.selected||!db.plans.some(p=>p.id===db.selected))db.selected=db.plans[0]?.id||null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('本地保存失败，可能是浏览器存储空间不足：'+e.message)}};
let tab='train',editing=null,session=null,ticker=null,audio=null,wake=null,review=null,quickItems=[];
function tone(freq,start,len,vol=.15){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+start;o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+len+.02)}catch(e){console.warn(e)}}
function beep(kind){const type=db.sounds[kind];if(type==='off')return;if(type==='long'){tone(kind==='finish'?900:kind==='set'?780:520,0,.85);return}if(type==='victory'){[620,780,980,1250].forEach((f,i)=>tone(f,i*.19,.28));return}if(type==='triple'){[0,.22,.44].forEach(t=>tone(900,t,.15));return}if(type==='double'){[0,.33].forEach(t=>tone(520,t,.23));return}if(type==='urgent'){[0,.16,.32,.48].forEach(t=>tone(1150,t,.13,.25));return}if(type==='bell'){[0,.5].forEach(t=>{tone(950,t,.42,.25);tone(1450,t,.36,.13)});return}if(type==='rising'){[520,700,900,1200].forEach((f,i)=>tone(f,i*.16,.2,.22));return}if(type==='alarm'){[0,.2,.6,.8].forEach(t=>tone(850,t,.17,.27));return}tone(740,0,.25)}
function touchAudio(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}
async function lock(){try{if('wakeLock'in navigator)wake=await navigator.wakeLock.request('screen')}catch{}}
function unlock(){try{wake?.release()}catch{}wake=null}
function show(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}

function upgradeSelects(){
 document.querySelectorAll('#view select').forEach(sel=>{
  if(sel.closest('.unified-select'))return;
  const wrap=document.createElement('div');wrap.className='unified-select';if(sel.dataset.key==='mode')wrap.classList.add('training-mode-select');
  const trigger=document.createElement('button');trigger.type='button';trigger.className='unified-trigger';
  trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');
  const menu=document.createElement('div');menu.className='unified-menu';menu.setAttribute('role','listbox');menu.hidden=true;
  sel.parentNode.insertBefore(wrap,sel);wrap.append(sel,trigger,menu);
  sel.classList.add('unified-native');
  function paint(){
   trigger.textContent=sel.selectedOptions[0]?.textContent||'请选择';
   menu.replaceChildren();
   [...sel.options].forEach((opt,i)=>{
    const item=document.createElement('button');item.type='button';item.className='unified-option';
    item.textContent=opt.textContent;item.dataset.value=opt.value;item.setAttribute('role','option');
    item.setAttribute('aria-selected',String(sel.selectedIndex===i));
    if(sel.selectedIndex===i)item.classList.add('selected');
    item.addEventListener('click',()=>{
     sel.value=opt.value;sel.dispatchEvent(new Event('change',{bubbles:true}));
     closeUnified();paint();
    });
    menu.append(item);
   });
  }
  trigger.addEventListener('click',()=>{
   const wasOpen=!menu.hidden;closeUnified();
   if(!wasOpen){paint();menu.hidden=false;wrap.classList.add('open');trigger.setAttribute('aria-expanded','true')}
  });
  paint();
 });
}
function closeUnified(){
 document.querySelectorAll('.unified-select').forEach(w=>{
  w.classList.remove('open');w.querySelector('.unified-menu').hidden=true;
  w.querySelector('.unified-trigger').setAttribute('aria-expanded','false');
 });
}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.unified-select'))closeUnified()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeUnified()});

function selectPlan(){return db.plans.find(p=>p.id===db.selected)||db.plans[0]}

function quickHTML(){return `<div class="panel"><h2>快速训练</h2><p class="muted">不用创建每日计划，选择动作就能开始。可临时调整组数、次数、负重和休息。</p>
<div class="row" style="gap:10px;flex-wrap:wrap"><div class="quick-name-wrap"><input id="quickName" type="text" autocomplete="off" placeholder="选择或输入动作名称" aria-label="快速训练动作名称" aria-haspopup="listbox" aria-expanded="false"><div id="quickSuggestions" class="exercise-name-options" role="listbox" hidden></div></div><button class="btn" id="quickAdd">添加动作</button></div>
${quickItems.map((it,i)=>`<div class="quick-card"><div class="row between"><b>${i+1}. ${escape(it.name)}</b><button class="btn" data-quick-remove="${i}">删除</button></div><div class="quick-grid">
<label class="field">训练类型<select data-quick="${i}" data-qkey="mode"><option value="reps" ${it.mode==='reps'?'selected':''}>按次数 · 正计时</option><option value="time" ${it.mode==='time'?'selected':''}>按时间 · 倒计时</option></select></label>
<label class="field">组数<input type="number" min="1" max="30" data-quick="${i}" data-qkey="sets" value="${it.sets}"></label>
${it.mode==='reps'?`<label class="field">目标次数<input type="number" min="0" data-quick="${i}" data-qkey="reps" value="${it.reps}"></label>`:`<label class="field">训练秒数<input type="number" min="1" data-quick="${i}" data-qkey="duration" value="${it.duration}"></label>`}
<label class="field">负重 kg<input type="number" min="0" step="0.5" data-quick="${i}" data-qkey="weight" value="${it.weight}"></label>
<label class="field">休息秒数<input type="number" min="0" data-quick="${i}" data-qkey="rest" value="${it.rest}"></label></div></div>`).join('')}
<div class="row between" style="margin-top:16px"><span class="muted">${quickItems.length} 个动作</span><button class="btn primary" id="quickStart" ${quickItems.length?'':'disabled'}>开始快速训练 →</button></div></div>`}
function trainHTML(){if(review)return reviewHTML();const p=selectPlan();if(!p)return '<div class="panel empty">请先创建一个训练计划</div>';if(!session)return quickHTML()+`<div class="panel"><h1>开始今天的训练</h1><p class="muted">选择计划，准备好后开始。每组动作可设置计次数或倒计时。</p><div class="plan-start-row"><label class="field plan-start-picker">训练计划<select id="trainPlan">${db.plans.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${escape(x.name)}</option>`).join('')}</select></label><button class="btn primary plan-start-button" id="start">开始训练 →</button></div><div class="muted plan-start-summary">${p.items.length} 个动作 · ${flatten(p).length} 组</div></div><div class="panel"><h3>今日训练内容</h3>${p.items.map((it,i)=>`<div class="setline"><div><b>${i+1}. ${escape(it.name)}</b><div class="muted small">${it.sets} 组 · ${it.mode==='reps'?it.reps+' 次（正计时）':it.duration+' 秒（倒计时）'} · ${it.weight} kg</div></div><span class="pill">休息 ${it.rest}s</span></div>`).join('')}</div>`;
const cur=session.queue[session.index],isPrep=session.phase==='prep',isRest=session.phase==='rest',done=session.results.length,total=session.queue.length;return `<div class="panel"><div class="row between"><span class="pill">${isPrep?'准备开始':isRest?'组间休息':'正在训练'}</span><span class="muted small">第 ${session.index+1} / ${total} 组</span></div><div class="timer"><div class="muted">${isPrep?'准备：'+escape(cur.name):isRest?'休息 · 下一组：'+escape(session.queue[session.index+1]?.name||'训练完成'):escape(cur.name)+' · 第 '+cur.setIndex+' 组'}</div><div class="clock ${isRest||isPrep?'orange':'accent'}" id="clock">00:00</div><div class="muted" id="clockDesc">${isPrep?'3 秒准备倒计时':isRest?'休息倒计时':cur.mode==='reps'?'正计时 · 完成后手动结束':'训练倒计时'}</div><div class="progress"><div style="width:${done/total*100}%"></div></div><div class="row" style="justify-content:center"><span class="pill">${cur.mode==='reps'?cur.reps+' 次目标':cur.duration+' 秒目标'}</span><span class="pill">${cur.weight} kg</span></div></div><div class="row" style="justify-content:center"><button class="btn ghost" id="pause">${session.paused?'继续':'暂停'}</button><button class="btn primary" id="next">${isPrep?'跳过准备 →':isRest?'跳过休息 →':'结束本组 →'}</button><button class="btn red" id="abort">放弃训练</button></div></div><div class="panel"><h3>训练进度 · 已完成 ${done}/${total} 组</h3>${session.queue.map((it,i)=>`<div class="setline"><span style="color:${i===session.index?'#b7f36a':i<done?'#9db5a0':'#83939c'}">${i<done?'✓':i===session.index?'▶':'○'} ${escape(it.name)} · 第 ${it.setIndex} 组</span><span class="muted small">${it.weight} kg</span></div>`).join('')}</div>`}
function startQuick(){if(!quickItems.length)return;const items=structuredClone(quickItems).map(it=>({...it,sets:num(it.sets,1,30),reps:num(it.reps),duration:num(it.duration,1,86399),rest:num(it.rest,0,3600),weight:num(it.weight)}));touchAudio();lock();session={planId:'quick',planName:'快速训练',queue:flatten({items}),index:0,phase:'prep',paused:false,remaining:3,elapsed:0,last:performance.now(),results:[],startedAt:new Date().toISOString()};save();startTicker();render()}
function start(){const p=selectPlan();if(!p||!flatten(p).length)return alert('计划中没有动作');touchAudio();lock();session={planId:p.id,planName:p.name,queue:flatten(p),index:0,phase:'prep',paused:false,remaining:3,elapsed:0,last:performance.now(),results:[],startedAt:new Date().toISOString()};save();startTicker();render()}
function startTicker(){clearInterval(ticker);ticker=setInterval(tick,150)}
function tick(){if(!session||session.paused)return;const now=performance.now(),delta=Math.max(0,(now-session.last)/1000);session.last=now;if(session.phase==='rest'||session.phase==='prep'||session.queue[session.index].mode==='time'){session.remaining-=delta;if(session.phase==='work')session.elapsed+=delta;if(session.remaining<=0){if(session.phase==='prep'){beginWork()}else if(session.phase==='rest'){beep('rest');advanceRest()}else{session.elapsed=Math.max(0,session.elapsed+session.remaining);session.remaining=0;finishSet()}render();return}}else session.elapsed+=delta;updateClock()}
function updateClock(){if(!session)return;const el=$('clock');if(!el)return;el.textContent=(session.phase==='rest'||session.phase==='prep'||session.queue[session.index].mode==='time')?fmt(Math.ceil(session.remaining)):fmt(session.elapsed);const d=$('clockDesc');if(d)d.textContent=session.paused?'已暂停':session.phase==='prep'?'准备开始 · 3 秒倒计时':session.phase==='rest'?'休息倒计时':session.queue[session.index].mode==='reps'?'正计时 · 手动结束本组':'训练倒计时'}
function finishSet(){if(!session||session.phase!=='work')return;const cur=session.queue[session.index];session.results.push({name:cur.name,exerciseId:cur.exerciseId,setIndex:cur.setIndex,mode:cur.mode,targetReps:cur.reps,targetSeconds:cur.duration,plannedWeight:cur.weight,actualReps:cur.mode==='reps'?cur.reps:0,actualWeight:cur.weight,actualSeconds:Math.round(session.elapsed),completed:true});if(session.index===session.queue.length-1){beep('finish');endSession();return}beep('set');session.phase='rest';session.remaining=num(cur.rest,0,3600);session.elapsed=0;session.last=performance.now();if(session.remaining<=0)advanceRest();render()}
function beginWork(){if(!session)return;session.phase='work';session.elapsed=0;session.remaining=session.queue[session.index].mode==='time'?num(session.queue[session.index].duration,1,7200):0;session.last=performance.now();render()}
function advanceRest(){if(!session)return;session.index++;session.phase='prep';session.elapsed=0;session.remaining=3;session.last=performance.now();render()}
function endSession(){clearInterval(ticker);unlock();review={...session,finishedAt:new Date().toISOString()};session=null;render()}
function next(){if(!session)return;touchAudio();if(session.phase==='prep'){beginWork()}else if(session.phase==='rest'){advanceRest()}else finishSet()}
function pause(){if(!session)return;session.paused=!session.paused;session.last=performance.now();render()}
let abortWasPaused=null;
function abort(){
 if(!session)return;
 const dlg=$('abortDialog');
 if(dlg.open)return;
 abortWasPaused=session.paused;
 session.paused=true;
 session.last=performance.now();
 updateClock();
 dlg.showModal();
}
function resumeAfterAbortDialog(){
 if(session&&abortWasPaused!==null){
  session.paused=abortWasPaused;
  session.last=performance.now();
  render();
 }

}
$('abortDialog').addEventListener('close',resumeAfterAbortDialog);
$('abortCancel').addEventListener('click',()=>$('abortDialog').close());

function reviewHTML(){return `<div class="panel"><h1>🎉 训练完成</h1><p class="muted">${escape(review.planName)} · ${review.results.length} 组。请核对实际完成次数和负重，再保存记录。</p><div class="notice">实际完成情况可修改。未完成的组可取消勾选，统计只计算标记为完成的组。</div>${review.results.map((r,i)=>`<div class="review-row"><div><b>${escape(r.name)} · 第 ${r.setIndex} 组</b><div class="badge">目标 ${r.mode==='reps'?r.targetReps+'次':r.targetSeconds+'秒'} · ${r.plannedWeight}kg</div><label class="small"><input type="checkbox" data-review="completed" data-i="${i}" ${r.completed?'checked':''}> 完成</label></div>${field('实际次数',r.actualReps,`type="number" min="0" step="1" data-review="actualReps" data-i="${i}"`)}${field('实际负重 kg',r.actualWeight,`type="number" min="0" step="0.5" data-review="actualWeight" data-i="${i}"`)}${field('实际秒数',r.actualSeconds,`type="number" min="0" step="1" data-review="actualSeconds" data-i="${i}"`)}</div>`).join('')}<label class="field">训练备注<textarea id="notes" rows="3" placeholder="今天的状态、动作感受、下次目标……"></textarea></label><div class="spacer"></div><button class="btn primary" id="saveReview">保存本次训练记录</button></div>`}

function statsHTML(){const records=db.records,sets=records.flatMap(r=>r.results.filter(s=>s.completed)),seconds=sets.reduce((a,s)=>a+num(s.actualSeconds),0),days=new Set(records.map(r=>new Date(r.startedAt||r.finishedAt).toLocaleDateString('en-CA'))).size,ex=[...new Set(sets.map(s=>s.name))].sort();return `<div class="row between"><div><h1>数据分析</h1><p class="muted">根据实际训练计时统计，不包含组间休息。</p></div><button class="btn ghost tiny" id="exportStats">导出备份</button></div><div class="grid"><div class="metric"><span class="muted">训练次数</span><strong>${records.length}</strong></div><div class="metric"><span class="muted">训练天数</span><strong>${days} 天</strong></div><div class="metric"><span class="muted">完成组数</span><strong>${sets.length}</strong></div><div class="metric"><span class="muted">实际训练时长</span><strong>${fmt(seconds)}</strong></div></div><div class="spacer"></div><div class="two"><div class="panel"><h3>近 10 次训练 · 完成组数</h3><svg class="chart" id="setsChart" viewBox="0 0 420 210"></svg></div><div class="panel"><h3>近 10 次训练 · 实际训练分钟</h3><svg class="chart" id="timeChart" viewBox="0 0 420 210"></svg></div></div><div class="panel"><h3>动作统计</h3>${ex.length?`<div class="grid">${ex.map(name=>{const x=sets.filter(s=>s.name===name);return `<div class="metric"><b>${escape(name)}</b><div class="muted small">完成 ${x.length} 组 · ${x.reduce((a,s)=>a+s.actualReps,0)} 次</div><div class="muted small">最大负重 ${Math.max(...x.map(s=>s.actualWeight))} kg</div><div class="muted small">实际训练 ${fmt(x.reduce((a,s)=>a+num(s.actualSeconds),0))}</div></div>`}).join('')}</div>`:'<div class="empty">暂无动作数据</div>'}</div><div class="panel"><h3>历史训练记录</h3>${records.length?records.slice().reverse().map(r=>`<div class="setline"><div><b>${escape(r.planName)}</b><div class="muted small">${date(r.finishedAt)} · ${r.results.filter(x=>x.completed).length} 组 · ${fmt(r.results.reduce((a,x)=>a+(x.completed?num(x.actualSeconds):0),0))}</div><div class="muted small">${escape(r.notes||'')}</div></div><button class="btn tiny red" data-delrecord="${r.id}">删除</button></div>`).join(''):'<div class="empty">暂无训练历史</div>'}</div>`}

function savedNames(){
 if(db.exerciseNamesVersion!==2){
  const previous=Array.isArray(db.exerciseNames)?db.exerciseNames:[];
  const planNames=db.plans.flatMap(p=>p.items.map(it=>it.name));
  db.exerciseNames=[...new Set([...names,...previous,...planNames].filter(n=>typeof n==='string'&&n.trim()).map(n=>n.trim()))];

}

// Reorder exercise cards with native HTML drag-and-drop.
let draggedExerciseIndex=null;
$('editorGoTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

const editorView=$('view');
editorView.addEventListener('dragstart',e=>{
  const card=e.target.closest('.exercise[data-ex]');
  if(!editing||!card)return;
  // Inputs and selectors must remain usable without initiating a drag.
  if(e.target.closest('input,select,textarea,button')){e.preventDefault();return}
  draggedExerciseIndex=Number(card.dataset.ex);
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',String(draggedExerciseIndex));
  requestAnimationFrame(()=>card.classList.add('dragging'));
});
editorView.addEventListener('dragover',e=>{
  const card=e.target.closest('.exercise[data-ex]');
  if(!editing||draggedExerciseIndex===null||!card)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  editorView.querySelectorAll('.exercise.drag-over').forEach(x=>x.classList.remove('drag-over'));
  if(Number(card.dataset.ex)!==draggedExerciseIndex)card.classList.add('drag-over');
});
editorView.addEventListener('drop',e=>{
  const card=e.target.closest('.exercise[data-ex]');
  if(!editing||draggedExerciseIndex===null||!card)return;
  e.preventDefault();
  const from=draggedExerciseIndex,to=Number(card.dataset.ex);
  draggedExerciseIndex=null;
  editorView.querySelectorAll('.exercise.dragging,.exercise.drag-over').forEach(x=>x.classList.remove('dragging','drag-over'));
  if(from===to||from<0||to<0||from>=editing.items.length||to>=editing.items.length)return;
  const [item]=editing.items.splice(from,1);
  editing.items.splice(to,0,item);
  render(); // Save Plan persists the updated order.
});
editorView.addEventListener('dragend',()=>{
  draggedExerciseIndex=null;
  editorView.querySelectorAll('.exercise.dragging,.exercise.drag-over').forEach(x=>x.classList.remove('dragging','drag-over'));
});
let timeTarget=null;
const WHEEL_ROW=64;
function wheelValue(id){return Math.max(0,Math.min(59,Math.round($(id).scrollTop/WHEEL_ROW)))}
function setWheel(id,value){const el=$(id);el.dispatchEvent(new Event('wheel-picker-reset'));el.scrollTop=value*WHEEL_ROW;updateWheel(id)}
function updateWheel(id){const el=$(id),v=wheelValue(id);el.querySelectorAll('.wheel-option').forEach((node,i)=>{node.classList.toggle('active',i===v);node.setAttribute('aria-selected',String(i===v))})}
for(const id of ['pickMin','pickSec']){const el=$(id);el.innerHTML=Array.from({length:60},(_,i)=>`<div class="wheel-option" role="option" data-value="${i}">${String(i).padStart(2,'0')}</div>`).join('');el.addEventListener('scroll',()=>updateWheel(id),{passive:true});el.addEventListener('click',e=>{const opt=e.target.closest('.wheel-option');if(opt)el.scrollTo({top:Number(opt.dataset.value)*WHEEL_ROW,behavior:'smooth'})});el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();setWheel(id,Math.max(0,Math.min(59,wheelValue(id)+(e.key==='ArrowDown'?1:-1))))}})}
// Drag with momentum: velocity is measured from recent pointer samples and decays smoothly.
for(const id of ['pickMin','pickSec']){
 const el=$(id);let drag=null,frame=0,suppressClick=false,snapTimer=0;
 const stop=()=>{if(frame)cancelAnimationFrame(frame);frame=0;clearTimeout(snapTimer);el.classList.remove('is-gliding')};
 const snap=()=>{el.classList.remove('is-gliding','is-dragging');const target=wheelValue(id)*WHEEL_ROW;el.scrollTo({top:target,behavior:'smooth'})};
 el.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  stop();el.classList.add('is-dragging');
  drag={id:e.pointerId,startY:e.clientY,lastY:e.clientY,lastT:performance.now(),samples:[],moved:false};
  el.setPointerCapture(e.pointerId);
 });
 el.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId)return;
  const now=performance.now(),dy=e.clientY-drag.lastY,dt=Math.max(1,now-drag.lastT);
  if(Math.abs(e.clientY-drag.startY)>4)drag.moved=true;
  if(drag.moved){
   el.scrollTop-=dy;
   drag.samples.push({v:-dy/dt,t:now});
   drag.samples=drag.samples.filter(x=>now-x.t<100).slice(-7);
   e.preventDefault();
  }
  drag.lastY=e.clientY;drag.lastT=now;
 });
 const finish=e=>{
  if(!drag||drag.id!==e.pointerId)return;
  const {moved,samples}=drag;drag=null;
  if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId);
  el.classList.remove('is-dragging');
  if(!moved)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,250);
  const recent=samples.filter(x=>performance.now()-x.t<110);
  let velocity=recent.length?recent.reduce((sum,x)=>sum+x.v,0)/recent.length:0;
  velocity=Math.max(-2.4,Math.min(2.4,velocity));
  if(Math.abs(velocity)<.12){snap();return}
  el.classList.add('is-gliding');let last=performance.now();
  const glide=now=>{
   const dt=Math.min(now-last,40);last=now;
   const before=el.scrollTop;
   el.scrollTop+=velocity*dt;
   velocity*=Math.pow(.94,dt/16);
   if(Math.abs(velocity)<.055||Math.abs(el.scrollTop-before)<.1){frame=0;snap();return}
   frame=requestAnimationFrame(glide);
  };
  frame=requestAnimationFrame(glide);
 };
 el.addEventListener('pointerup',finish);
 el.addEventListener('pointercancel',finish);
 el.addEventListener('click',e=>{if(suppressClick){e.stopImmediatePropagation();e.preventDefault()}},true);
 el.addEventListener('wheel',()=>{stop();clearTimeout(snapTimer);snapTimer=setTimeout(snap,140)},{passive:true});
 el.addEventListener('keydown',stop);
 el.addEventListener('wheel-picker-reset',()=>{stop();el.classList.remove('is-dragging')});
}
